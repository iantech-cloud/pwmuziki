<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Pwmuziki{% endblock %}</title><style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#172033}header{background:#172033;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}nav a{color:white;margin-left:18px;text-decoration:none}.container{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 8px 24px #17203312;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.button{display:inline-block;background:#2b6cb0;color:white;padding:10px 16px;border-radius:8px;text-decoration:none}</style></head>
