{% extends 'base.html' %}
{% block title %}{{ heading }} | AuraCity{% endblock %}
{% block content %}
<main class="form-page dashboard-action-page">
  <p class="eyebrow">{{ eyebrow }}</p>
  <h1>{{ heading }}</h1>
  <form method="post" class="auth-form workspace-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button button-primary" type="submit">{{ submit_label }} <span aria-hidden="true">→</span></button>
  </form>
</main>
{% endblock %}
